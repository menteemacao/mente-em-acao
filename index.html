<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#6a35d4"><meta name="description" content="Aventuras infantis educativas com Iskai"><link rel="manifest" href="manifest.webmanifest"><title>Mente em Ação • Iskai</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#40235e;background:#e9fbff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#ffe5fa,transparent 40%),linear-gradient(150deg,#a6eaff,#f5dcff 52%,#fff1a4);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #4b3aff;outline-offset:3px}.shell{max-width:1120px;margin:auto;min-height:100vh;padding:12px 14px 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;background:#fffdf6e8;border:3px solid #fff;border-radius:24px;box-shadow:0 6px 18px #6c30a127;position:relative;z-index:2}.logo{font-size:clamp(19px,3.3vw,32px);font-weight:1000;color:#8137d7;text-shadow:1px 2px #ffd66d;line-height:1.04}.sub{font-size:12px;color:#6b5585}.tools{display:flex;gap:6px}.round{background:#fff1a8;border:2px solid white;border-radius:16px;min-width:44px;min-height:44px;box-shadow:0 3px 0 #dfb95d;font-size:22px}.hero{margin:14px 0 10px;min-height:260px;border:5px solid #fff;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 9px 28px #5c23923b;background:linear-gradient(100deg,#6335ae88,#5426aa15),url('assets/img/aventuras.webp') center 48%/cover}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#34116e9e 0%,#57258c38 55%,transparent)}.heroContent{position:relative;z-index:1;color:white;padding:27px 24px;max-width:550px;text-shadow:0 2px 5px #30115e}.hero h1{font-size:clamp(29px,5vw,54px);margin:0 0 8px;line-height:1.02}.hero p{font-size:clamp(16px,2.3vw,23px);font-weight:700}.bigbtn{border:3px solid #fff;border-radius:22px;padding:13px 22px;background:linear-gradient(#ffe46c,#ffb835);font-size:19px;font-weight:1000;color:#61337e;box-shadow:0 5px 0 #cf8e22,0 7px 18px #35204c44}.bigbtn:active,.world:active,.option:active{transform:translateY(3px)}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}.sectionHead h2{margin:0;font-size:clamp(21px,3vw,31px);color:#7434b4;text-shadow:1px 2px #fff}.counter{border-radius:22px;padding:8px 13px;background:#fff5c4;font-weight:900}.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}.world{min-height:215px;border:4px solid white;border-radius:27px;overflow:hidden;position:relative;box-shadow:0 7px 0 #a85aa1,0 10px 24px #4c27982d;text-align:left;background:#a4e7f4;transition:transform .16s}.world .art{position:absolute;inset:0;background-image:var(--bg);background-position:var(--pos);background-size:cover;filter:saturate(1.3)}.world:after{content:'';position:absolute;inset:25% 0 0;background:linear-gradient(transparent,#32104ebd)}.world .worldTitle{position:absolute;z-index:1;bottom:11px;left:13px;right:13px;color:white;font-size:20px;font-weight:1000;text-shadow:0 2px 5px #311255}.world .worldTitle small{display:block;font-size:13px;margin-top:3px;color:#ffe991}.bubble{position:absolute;top:8px;left:9px;z-index:1;background:#fff9db;border:2px solid white;border-radius:100px;padding:7px 10px;font-size:24px}.game{background:#fff9f1;border:5px solid white;border-radius:32px;box-shadow:0 10px 30px #64389e36;margin-top:15px;overflow:hidden}.gameHeader{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,#a85ff0,#ef87b9);color:white;font-weight:900}.progress{display:flex;gap:6px;align-items:center;flex:1;max-width:370px}.dot{flex:1;height:12px;border:2px solid #fff9;border-radius:9px;background:#ffffff44}.dot.done{background:#ffe75b}.gameStage{position:relative;min-height:205px;background:linear-gradient(#2e175566,#2e175566),url('assets/img/jogo.webp') center/cover;display:flex;align-items:center;justify-content:center;padding:22px}.mascot{width:104px;height:112px;object-fit:cover;object-position:center 20%;border:4px solid white;border-radius:27px;box-shadow:0 7px 20px #25134844}.speech{max-width:640px;padding:17px 20px;background:#fffdf6;border:4px solid #ffd858;border-radius:26px;color:#542778;font-size:clamp(19px,3vw,27px);font-weight:900;line-height:1.24;box-shadow:0 6px 0 #a461d2;position:relative}.scene{display:flex;gap:16px;align-items:center}.choices{padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.option{min-height:155px;border:4px solid white;border-radius:25px;background:linear-gradient(150deg,#fff,#d5f6ff);box-shadow:0 6px 0 #76a7e2,0 7px 14px #47356a22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#492878;font-size:clamp(15px,2vw,22px);font-weight:900;padding:10px}.option:nth-child(2){background:linear-gradient(140deg,#fff9de,#ffe4ab);box-shadow:0 6px 0 #edb55a}.option:nth-child(3){background:linear-gradient(140deg,#fff0fa,#e7d9ff);box-shadow:0 6px 0 #b18ce4}.option .pic{font-size:clamp(38px,7vw,65px);filter:drop-shadow(0 4px 2px #0002)}.option.selected{outline:5px solid #56d68c}.option.dim{opacity:.48}.bottom{padding:10px 18px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.feedback{font-size:clamp(18px,2.6vw,25px);font-weight:900;color:#4c257d;padding:16px;border-radius:20px;background:#e4ffe9;border:3px solid #a8e7b2;margin:0 18px 14px}.reward{font-size:clamp(23px,5vw,50px);animation:pop .5s ease-out}.panel{background:#fffcf4;border:4px solid white;border-radius:30px;padding:25px;margin:16px auto;max-width:850px;text-align:center;box-shadow:0 9px 30px #4628752b}.panel h2{font-size:clamp(26px,5vw,46px);color:#8030c5}.panel p{font-size:19px}.mini{font-size:13px;color:#715d8a}.footer{font-size:13px;text-align:center;color:#6d4786;margin-top:25px}.hidden{display:none!important}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}@media(max-width:630px){.shell{padding:8px}.hero{min-height:230px}.heroContent{padding:20px}.worlds{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.world{min-height:180px}.world .worldTitle{font-size:16px}.choices{gap:7px;padding:10px}.option{min-height:140px;padding:6px;font-size:14px;border-width:3px}.option .pic{font-size:41px}.gameStage{padding:13px;min-height:180px}.mascot{width:76px;height:91px}.speech{font-size:18px;padding:11px}.gameHeader{font-size:13px}.scene{gap:9px}}

.gameStage{background-image:linear-gradient(90deg,#28115899,#32106820),var(--stage-art)!important;background-position:center!important;background-size:cover!important;min-height:285px}.activity{padding:16px;background:linear-gradient(130deg,#e4faff,#fff0fa);border-top:5px solid white}.activity h3{text-align:center;color:#652f98;font-size:clamp(20px,3vw,29px)}.drag-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drag-items,.drop-area{display:flex;flex-wrap:wrap;gap:10px;align-content:center;justify-content:center;border:4px dashed #ad8bda;border-radius:24px;padding:12px;min-height:190px;background:#ffffffbb}.drag-token,.drop-target{min-width:100px;min-height:100px;padding:10px;border:4px solid white;border-radius:20px;background:#fff1a9;color:#51257b;font-size:17px;font-weight:900;box-shadow:0 5px #d7aa52;touch-action:manipulation}.drag-token .pic,.drop-target .pic,.connect-node .pic{display:block;font-size:42px}.drag-token.active,.connect-node.active{outline:5px solid #58cfa5}.drop-target{background:#d7ffe7;border:4px dashed #71c69b}.connect-wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:15px;min-height:260px}.connect-col{display:flex;flex-direction:column;gap:10px;justify-content:space-around;position:relative;z-index:2}.connect-node{border:4px solid white;border-radius:20px;background:#fff1b2;padding:8px;min-height:70px;color:#51257b;font-weight:900;font-size:17px;box-shadow:0 5px #d7aa52}.connect-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.activity-note{text-align:center;color:#634580;font-weight:700}.world .art{filter:saturate(1.1)}@media(max-width:630px){.drag-token,.drop-target{min-width:78px;min-height:85px;font-size:13px}.drag-token .pic,.drop-target .pic,.connect-node .pic{font-size:30px}.connect-node{font-size:13px}.gameStage{min-height:240px}}
</style></head><body><main id="app" class="shell"></main><script src="data.js"></script><script>
const $=s=>document.querySelector(s),app=$('#app'),worlds=window.GAME_WORLDS||[];
const icons=['🤖','🤝','👓','🌟','🌻','🕊️','📚','🌈','🌺','💫'];
const palette=['#45ccf4','#fb7ec6','#ab89ff','#ffcb60','#7de6a6','#f6a7cd','#ffcf8c','#8acfff','#f6b4f2','#b69aff'];
let world=0,stage=0,chosen=-1,sound=true,voice=false,mode='home';let selectedDrag=null,selectedConnect=null;
let progress={};try{progress=JSON.parse(localStorage.getItem('iskai_progress_v4')||'{}')}catch(e){}
const soundfiles={intro:'abertura',star:'estrela',click:'clique',next:'transicao',steps:'passos'};
const audioBank={};
function playSound(type,volume=.42){
 if(!sound)return;
 const name=soundfiles[type];if(!name)return;
 try{
   let a=audioBank[type];
   if(!a){a=new Audio('assets/audio/'+name+'.mp3');a.preload='auto';audioBank[type]=a}
   a.pause();a.currentTime=0;a.volume=volume;
   if(type==='steps')a.addEventListener('timeupdate',function stop(){if(a.currentTime>1.1){a.pause();a.removeEventListener('timeupdate',stop)}});
   const attempt=a.play();
   if(attempt&&attempt.catch)attempt.catch(()=>showToast('Toque no botão 🎵 para ativar os sons.'));
 }catch(e){showToast('Não foi possível reproduzir este som.')}
}
function testSound(){sound=true;playSound('star',.65);showToast('🔊 Sons das brincadeiras ativados!');render()}

function intro(){playSound('intro',.9)}
function voiceText(t){if(!voice||!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt-br'));const female=v.find(x=>/maria|francisca|luciana|helena|camila|femin|female|vitória|vitoria/i.test(x.name));if(!female){showToast('A voz das fases depende do aparelho. A apresentação da Iskai está gravada.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.voice=female;u.rate=.91;u.pitch=1.15;speechSynthesis.speak(u)}
function showToast(t){let el=document.createElement('div');el.style='position:fixed;z-index:30;bottom:15px;left:50%;transform:translateX(-50%);background:#45216d;color:white;border:3px solid white;border-radius:18px;padding:12px 18px;max-width:92vw;text-align:center;font-weight:700';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3600)}
function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function chrome(){return `<header class="top"><div><div class="logo">🌈 Mente em Ação <span style="color:#ed6a98">• Iskai</span></div><div class="sub">Aventuras para aprender brincando</div></div><div class="tools"><button class="round" onclick="toggleSound()" aria-label="Ligar ou desligar sons">${sound?'🎵':'🔇'}</button><button class="round" onclick="toggleVoice()" aria-label="Ligar ou desligar voz">${voice?'🗣️':'🔕'}</button><button class="round" onclick="home()" aria-label="Voltar ao início">🏠</button></div></header>`}
function toggleSound(){sound=!sound;render();if(sound){playSound('star',.65);showToast('🔊 Sons ativados!')}else showToast('🔇 Sons desligados')};function toggleVoice(){voice=!voice;if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();render()}
function home(){mode='home';let stars=Object.values(progress).reduce((a,b)=>a+b,0);app.innerHTML=chrome()+`<section class="hero"><div class="heroContent"><h1>🐶 Vamos brincar com a Iskai!</h1><p>Dez mundos mágicos, novas descobertas e muitas estrelinhas!</p><button class="bigbtn" onclick="intro()">🔊 Ouvir a Iskai</button> <button class="bigbtn" onclick="testSound()">🎵 Testar sons</button></div></section><div class="sectionHead"><h2>✨ Escolha uma aventura</h2><span class="counter">⭐ ${stars}/80</span></div><div class="worlds">${worlds.map((w,i)=>`<button class="world" style="--bg:url('assets/img/${i%3===0?'mundos':i%3===1?'jogo':'aventuras'}.webp');--pos:${20+i*7}% center;background-color:${palette[i]}" onclick="start(${i})"><span class="art"></span><span class="bubble">${icons[i]}</span><span class="worldTitle">${esc(w.name)}<small>⭐ ${progress[i]||0}/8 • Jogar ▶</small></span></button>`).join('')}</div><p class="footer">Feito para brincar em família • Sem anúncios • O progresso fica neste aparelho</p>`}
function start(i){world=i;stage=0;chosen=-1;selectedDrag=null;selectedConnect=null;mode='game';playSound('next',.5);render()}
function stageSpeech(){let q=worlds[world].stages[stage];return q.question+'. Opções: '+q.options.map((x,i)=>['Primeira','Segunda','Terceira'][i]+': '+x).join('. ')}
function iconFor(t,i){let s=t.toLowerCase();let pairs=[[/convers|falar|pergunt|contar|dialog|explic/,'💬'],[/escut|ouvir|atenção/,'👂'],[/ajud|cuid|acolh|oferec/,'🤲'],[/amor|abraç|carinh/,'💗'],[/sorr|alegr|feliz/,'😊'],[/brinc|jogar/,'🧸'],[/grit|brigar|xingar/,'😠'],[/escond|fugir/,'🙈'],[/empurr|bater/,'✋'],[/pens|reflet|imagina/,'💭'],[/respir|calm|paz/,'🌿'],[/compartilh|divid/,'🎁'],[/desculp|perdo/,'💛'],[/livro|ler|estud/,'📚'],[/orar|prece|jesus/,'🕊️'],[/tentar|recomeç/,'🌱'],[/esper|paciênc/,'⏳'],[/verdade|sincer/,'✨'],[/culp|reclama/,'🌧️'],[/respeit/,'🤝']];for(let [r,e] of pairs)if(r.test(s))return e;return ['🌼','🦋','🌟'][i]}

function stageImage(){return ['mundos','amigos','jogo','aventuras','iskai','mascote'][(world+Math.floor(stage/2))%6]}
function activityMarkup(q){
if(stage%2===0)return `<div class="activity"><h3>🧩 Leve a figura até a estrela!</h3><div class="drag-layout"><div class="drag-items">${q.options.map((o,i)=>`<button draggable="true" class="drag-token" ondragstart="dragStart(event,${i})" onclick="pickDrag(${i})"><span class="pic">${iconFor(o,i)}</span>${esc(o)}</button>`).join('')}</div><div class="drop-area"><button class="drop-target" ondragover="event.preventDefault()" ondrop="dropChoice(event)" onclick="dropPicked()"><span class="pic">⭐</span>Coloque aqui!</button></div></div><p class="activity-note">👆 Toque na figura e depois na estrela, ou arraste com o dedo.</p></div>`;
return `<div class="activity"><h3>🌈 Ligue a figura à estrela!</h3><div class="connect-wrap" id="connectWrap"><svg class="connect-svg" id="lines"></svg><div class="connect-col">${q.options.map((o,i)=>`<button class="connect-node" data-answer="${i}" onclick="pickConnect(${i})"><span class="pic">${iconFor(o,i)}</span>${esc(o)}</button>`).join('')}</div><div class="connect-col"><button class="connect-node" onclick="connectTarget()"><span class="pic">⭐</span>Estrela da escolha</button></div></div><p class="activity-note">👆 Toque na figura e depois na estrela para ligar os pontos.</p></div>`}
function dragStart(e,i){selectedDrag=i;e.dataTransfer.setData('text/plain',String(i))}
function pickDrag(i){selectedDrag=i;document.querySelectorAll('.drag-token').forEach((el,j)=>el.classList.toggle('active',i===j))}
function dropPicked(){if(selectedDrag!==null)choose(selectedDrag)}
function dropChoice(e){e.preventDefault();const v=e.dataTransfer.getData('text/plain');if(v!=='')choose(Number(v));else dropPicked()}
function pickConnect(i){selectedConnect=i;document.querySelectorAll('.connect-node[data-answer]').forEach((el,j)=>el.classList.toggle('active',j===i))}
function connectTarget(){if(selectedConnect===null)return;const a=document.querySelector(`.connect-node[data-answer="${selectedConnect}"]`),b=document.querySelector('.connect-col:last-child .connect-node'),w=document.querySelector('#connectWrap'),svg=document.querySelector('#lines');if(a&&b&&w&&svg){const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),wr=w.getBoundingClientRect();svg.innerHTML=`<line x1="${ar.right-wr.left}" y1="${ar.top+ar.height/2-wr.top}" x2="${br.left-wr.left}" y2="${br.top+br.height/2-wr.top}" stroke="#ffbb32" stroke-width="9" stroke-linecap="round"/>`;}choose(selectedConnect)}
function render(){if(mode==='home'){home();return}if(mode==='end'){finish();return}let w=worlds[world],q=w.stages[stage];app.innerHTML=chrome()+`<section class="game"><div class="gameHeader"><button class="round" onclick="home()" aria-label="Voltar">⬅️</button><span>${icons[world]} ${esc(w.name)}</span><div class="progress" aria-label="Fase ${stage+1} de 8">${Array.from({length:8},(_,i)=>`<span class="dot ${i<=stage?'done':''}"></span>`).join('')}</div><span>⭐ ${stage+1}/8</span></div><div class="gameStage" style="--stage-art:url('assets/img/${stageImage()}.webp')"><div class="scene"><img class="mascot" src="assets/img/mascote.webp" alt="Iskai, cachorrinha dourada"><div class="speech">${esc(q.question)}<div style="margin-top:10px"><button class="round" onclick="voiceText(stageSpeech())" aria-label="Ouvir a pergunta">🔊</button> <small style="font-size:13px">Ouvir</small></div></div></div></div><div class="hidden choices">${q.options.map((opt,i)=>`<button class="option ${chosen===i?'selected':''} ${chosen!==-1&&chosen!==i?'dim':''}" onclick="choose(${i})" ${chosen!==-1?'disabled':''} aria-label="${esc(opt)}"><span class="pic">${iconFor(opt,i)}</span><span>${esc(opt)}</span></button>`).join('')}</div>${activityMarkup(q)}<div id="result"></div><div class="bottom"><span class="mini">👆 Toque na figura para escolher</span><button class="bigbtn" onclick="next()" id="next" ${chosen===-1?'disabled style="opacity:.4"':''}>${stage===7?'🏆 Concluir':'➡️ Próxima fase'}</button></div></section>`}
function choose(i){if(chosen!==-1)return;chosen=i;playSound('click',.55);let q=worlds[world].stages[stage];const good=i===q.answer;let result=$('#result');result.innerHTML=`<div class="feedback"><span class="reward">${good?'⭐✨':'💛🌷'}</span> ${good?'Que descoberta bonita!':'Vamos pensar juntos!'}<p style="margin:8px 0 0;font-size:18px">${esc(q.feedback)}</p><button class="round" onclick="voiceFeedback()" aria-label="Ouvir orientação">🔊</button></div>`;if(good){playSound('star',.65)}else{playSound('next',.38)}progress[world]=Math.max(progress[world]||0,stage+1);localStorage.setItem('iskai_progress_v4',JSON.stringify(progress));$('#next').disabled=false;$('#next').style.opacity='1';document.querySelectorAll('.option,.drag-token,.connect-node').forEach(el=>el.disabled=true)}
function voiceFeedback(){voiceText(worlds[world].stages[stage].feedback)}
function next(){if(chosen===-1)return;playSound('next');if(stage===7){mode='end';render()}else{stage++;chosen=-1;selectedDrag=null;selectedConnect=null;render()}}
function finish(){let w=worlds[world];app.innerHTML=chrome()+`<section class="panel"><div style="font-size:65px">🏆🌈🐶</div><h2>Oba! Aventura concluída!</h2><p>Você explorou <b>${esc(w.name)}</b> e conquistou novas descobertas!</p><div class="reward">⭐⭐⭐⭐⭐⭐⭐⭐</div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px"><button class="bigbtn" onclick="home()">🏠 Escolher aventura</button><button class="bigbtn" onclick="start(${world})">🔄 Brincar de novo</button></div></section>`;playSound('star',.7)}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});home();
</script></body></html>
