<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#258dd4"><link rel="manifest" href="manifest.webmanifest"><title>Mente em Ação</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#bdefff,#ebf9ff 55%,#dbf4c2);color:#153c61;min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid #ffcf42;outline-offset:3px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 15px;background:#208dd5;color:white;box-shadow:0 3px 10px #14558b55}.logo{font-size:clamp(20px,4vw,32px);font-weight:1000;text-shadow:1px 2px #115f9d}.tools{display:flex;gap:7px}.round{border:3px solid #fff7a4;border-radius:50%;width:51px;height:51px;background:linear-gradient(#fff6aa,#f7a83a);box-shadow:0 4px #bd7723;font-size:25px}.round[aria-pressed=true]{filter:grayscale(.7)}main{max-width:1100px;margin:auto;padding:15px 12px 110px}.cover{width:100%;border-radius:24px;border:4px solid white;box-shadow:0 7px 20px #164b7b50;max-height:340px;object-fit:cover;object-position:top}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:18px}.world{border:4px solid #fff8b4;border-radius:27px;min-height:160px;padding:16px 8px;background:linear-gradient(#6bc1ff,#167bd2);box-shadow:0 7px #165995;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:7px;color:white}.world:nth-child(5n+2){background:linear-gradient(#d5a5ff,#9252d5);box-shadow:0 7px #7041a4}.world:nth-child(5n+3){background:linear-gradient(#a7ed90,#3cba72);box-shadow:0 7px #27884e}.world:nth-child(5n+4){background:linear-gradient(#ffd075,#f48c35);box-shadow:0 7px #b56526}.world:nth-child(5n+5){background:linear-gradient(#ffb8d7,#e772b3);box-shadow:0 7px #a64e85}.emoji{font-size:clamp(46px,7vw,72px);filter:drop-shadow(0 4px 1px #0003)}.smallnum{border-radius:99px;background:#fff4a7;color:#83500e;padding:5px 11px;font-size:16px;font-weight:900}.panel{background:#fffdf8;border:4px solid #ffd77c;border-radius:28px;max-width:800px;margin:8px auto;padding:22px;box-shadow:0 9px #d5a354}.scene{font-size:clamp(68px,12vw,130px);text-align:center;padding:12px;background:linear-gradient(#d6f2ff,#f1ffdd);border-radius:25px}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{display:flex;gap:6px;margin:16px 0}.dot{flex:1;height:15px;border-radius:20px;background:#dce6ed}.dot.done{background:#ffcb35}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.choice{min-height:160px;background:linear-gradient(#fff,#d8efff);border:4px solid #75b9e7;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;box-shadow:0 6px #5c9fc6;color:#234969}.choice .symbol{font-size:clamp(52px,9vw,86px)}.choice .label{font-weight:800;font-size:clamp(12px,2.5vw,18px);line-height:1.15}.choice.selected{background:#d9ffd8;border-color:#48ad58}.choice:disabled{opacity:.7}.primary{background:linear-gradient(#9aee77,#31ae4b);border:3px solid white;box-shadow:0 5px #1e7f35;border-radius:99px;color:white;font-size:23px;padding:12px 22px;font-weight:900}.secondary{background:#e2f4ff;border:3px solid #a5d5f0;border-radius:99px;font-size:22px;padding:10px 17px}.feedback{text-align:center;font-size:25px;padding:12px}.stars{font-size:26px;font-weight:900;color:#ffea8e}.footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:12px;padding:10px;background:#815129;z-index:3}.footer button{border:3px solid #fff4a6;border-radius:22px;background:linear-gradient(#6ec6ff,#1680d2);font-size:31px;min-width:65px;min-height:54px}.parent{font-size:15px;color:#50657a}.hidden{display:none!important}.adult{border:2px dashed #c0d4df;border-radius:12px;padding:10px;margin-top:14px}.adult details{margin-top:8px}.muted{color:#46657a}.phasebadge{background:#fff0b2;border-radius:99px;padding:8px 15px;font-weight:900;font-size:21px}.win{font-size:90px;text-align:center;animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.world{min-height:130px}.panel{padding:13px}.choice{min-height:135px}.choices{gap:7px}.cover{max-height:250px}.tools .round{width:43px;height:43px;font-size:21px}}

/* Illustrated activities, large touch targets, and voice controls */
.world{padding:8px;overflow:hidden}.world .emoji{display:none}.world-art{width:100%;height:112px;object-fit:cover;object-position:center;border-radius:18px;border:3px solid #fff5bb;box-shadow:0 3px 7px #0003}.world .smallnum{font-size:13px}.world .playicon{font-size:27px}.scene{padding:0;overflow:hidden;position:relative;min-height:185px;display:flex;align-items:center;justify-content:center}.scene img{width:100%;height:220px;object-fit:cover;object-position:center}.scene .bubble{position:absolute;right:9px;bottom:9px;background:#fff9d9;border:3px solid #ffc74c;border-radius:99px;padding:7px 13px;font-size:22px;box-shadow:0 4px #0002}.choice{padding:8px;min-height:156px;background:linear-gradient(180deg,#fff8e6,#e7f3ff);position:relative;overflow:hidden}.choice .symbol{font-size:clamp(62px,9vw,92px);display:block;filter:drop-shadow(0 5px 3px #0002)}.choice .label{font-size:14px;color:#24496a}.choice:active{transform:scale(.97)}.choice.dragging{opacity:.55}.star-drop{margin:14px auto 0;min-height:82px;max-width:300px;border:4px dashed #eebc36;border-radius:25px;background:#fff6c9;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 0 12px #ffcf6955}.star-drop.over{background:#ddffdb;border-color:#39ac53}.voice-settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.voice-settings select{font-size:16px;border:2px solid #8bc7e8;border-radius:12px;background:white;padding:9px;max-width:100%}.voice-settings label{font-size:16px}.home-cover{position:relative}.home-cover .cover{display:block}.instructions{font-size:14px;color:#42637d;text-align:center;margin:7px}.world:focus-visible,.choice:focus-visible{outline:5px solid #ffcd2d}
@media(max-width:650px){.world-art{height:105px}.scene img{height:175px}.choice .label{font-size:11px}.choice{min-height:132px}.star-drop{min-height:65px}}
 .iskai-welcome{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;background:#fff8e4;border:3px solid #ffd465;border-radius:22px;margin:12px auto;max-width:800px}.iskai-welcome img{width:100px;height:105px;object-fit:cover;object-position:center top;border-radius:18px}.iskai-welcome button{background:#ffce50;border:0;border-radius:16px;padding:12px;font-weight:800;color:#64360a}.sound-toggle{font-size:14px;margin-left:6px} </style></head><body><header class="top"><div class="logo">🧠 Mente em Ação</div><div class="tools"><button id="voice" class="round" title="Ligar ou desligar voz" aria-label="Ligar ou desligar voz">🔊</button><button id="repeat" class="round" title="Ouvir novamente" aria-label="Ouvir novamente">🔁</button><span class="stars" id="stars">⭐0</span></div></header><main id="app"></main><nav class="footer"><button aria-label="Início" onclick="home()">🏠</button><button aria-label="Conquistas" onclick="awards()">🏆</button><button aria-label="Ouvir instruções" onclick="repeatVoice()">🔊</button><button aria-label="Área do adulto" onclick="adult()">⚙️</button></nav><script src="data.js"></script><script>
const SOUND_FILES={intro:'iskai-apresentacao',click:'clique',star:'estrela',next:'passagem',move:'movimento',steps:'passinhos',leaves:'folhas',pieces:'pecas',fun:'cartoon'};
let effectsOn=true,activeVoiceAudio=null,lastVoiceMode='tts',introPlayed=false;
const soundCache={};
function audioFile(name){if(!soundCache[name]){let a=new Audio('assets/audio/'+SOUND_FILES[name]+'.mp3');a.preload='auto';soundCache[name]=a}return soundCache[name]}
function playEffect(name,vol=.25){if(!effectsOn||!SOUND_FILES[name])return;try{let a=audioFile(name).cloneNode();a.volume=Math.min(.55,vol);a.play().catch(()=>{})}catch(e){}}
function stopVoice(){if(activeVoiceAudio){activeVoiceAudio.pause();activeVoiceAudio.currentTime=0;activeVoiceAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function playIskaiIntro(){lastVoiceMode='intro';lastSpeech='Oi! Que alegria! Eu sou a Iskai, sua amiga cachorrinha!';if(!voiceOn)return;stopVoice();let a=audioFile('intro').cloneNode();a.volume=.95;activeVoiceAudio=a;a.play().catch(()=>{activeVoiceAudio=null})}
function repeatVoice(){if(lastVoiceMode==='intro')playIskaiIntro();else say(lastSpeech)}
function playOnStart(){if(!introPlayed){introPlayed=true;playIskaiIntro()}else say('Escolha uma aventura tocando na figura. Vamos brincar!')}
const app=document.getElementById('app');let voiceOn=true,lastSpeech='',worldIndex=0,phaseIndex=0,finished=false,locked=false;let selectedVoiceURI='', speechRate=.96;let saved={};try{saved=JSON.parse(localStorage.getItem('mente-em-acao-audio-v2')||'{}')}catch{};saved.done=saved.done||{};saved.stars=saved.stars||0;const store=()=>{localStorage.setItem('mente-em-acao-audio-v2',JSON.stringify(saved));document.getElementById('stars').textContent='⭐'+saved.stars};store();function ptVoices(){return ('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>/^pt(-|_)/i.test(v.lang))}
function preferredVoice(){let voices=ptVoices();return voices.find(v=>v.voiceURI===selectedVoiceURI)||voices.find(v=>/pt[-_]BR/i.test(v.lang)&&/natural|neural|premium|enhanced|google|microsoft/i.test(v.name))||voices.find(v=>/pt[-_]BR/i.test(v.lang))||voices[0]}
function say(t){lastVoiceMode='tts';stopVoice();lastSpeech=t;if(!voiceOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=speechRate;u.pitch=1.04;u.volume=1;let v=preferredVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
document.getElementById('voice').onclick=()=>{voiceOn=!voiceOn;document.getElementById('voice').textContent=voiceOn?'🔊':'🔇';document.getElementById('voice').setAttribute('aria-pressed',String(!voiceOn));if(!voiceOn)stopVoice();else repeatVoice()};document.getElementById('repeat').onclick=()=>repeatVoice();function home(){finished=false;app.innerHTML='<div class="iskai-welcome"><img src="assets/iskai.webp" alt="Iskai, cachorrinha Labrador dourada"><button onclick="playIskaiIntro()">🐶 Conheça a Iskai! 🔊</button><button class="sound-toggle" onclick="toggleEffects(this)" aria-label="Ligar ou desligar efeitos sonoros">🎵 Sons: ligados</button></div><div class="home-cover"><img class="cover" src="assets/mundo.png" alt="Mundo colorido com dez aventuras"></div><div class="grid">'+WORLDS.map((w,i)=>`<button class="world" aria-label="${w.title}, oito fases" onclick="start(${i})"><img class="world-art" src="assets/aventura-${i}.webp" alt=""><span class="smallnum">${(Object.keys(saved.done).filter(k=>k.startsWith(i+'-')).length)}/8 ⭐</span><span class="playicon">▶️</span></button>`).join('')+'</div>';playOnStart()};
function start(i){playEffect('next',.18);worldIndex=i;let first=WORLDS[i].phases.findIndex((_,n)=>!saved.done[i+'-'+n]);phaseIndex=first<0?0:first;phase()};function phase(){locked=false;finished=false;let w=WORLDS[worldIndex],q=w.phases[phaseIndex];app.innerHTML=`<section class="panel"><div class="actions"><button class="secondary" onclick="home()" aria-label="Voltar">🏠</button><span class="phasebadge">${phaseIndex+1} / 8 ⭐</span><button class="secondary" onclick="repeatVoice()" aria-label="Ouvir novamente">🔊</button></div><div class="progress">${w.phases.map((_,i)=>`<div class="dot ${saved.done[worldIndex+'-'+i]?'done':''}"></div>`).join('')}</div><div class="scene"><img src="assets/aventura-${worldIndex}.webp" alt="Ilustração colorida da aventura"><button class="bubble" onclick="speakQuestion()" aria-label="Ouvir a história">🔊 🐶</button></div><div class="instructions" aria-hidden="true">👆 🖼️ ➡️ ⭐</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" draggable="true" data-choice="${i}" aria-label="${c.label}" onclick="choose(${i})"><span class="symbol">${c.icon}</span><span class="label">${c.label}</span></button>`).join('')}</div><div class="star-drop" id="starDrop" role="button" tabindex="0" aria-label="Arraste uma escolha para a estrela">⭐</div><div id="result" aria-live="polite"></div><div class="adult"><details><summary class="parent">👨‍👩‍👧 Para o adulto</summary><p class="parent">${w.title}: ${w.desc}. Fase ${phaseIndex+1}: ${q.question}</p></details></div></section>`;
let drop=document.getElementById('starDrop');document.querySelectorAll('.choice').forEach(el=>{el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',el.dataset.choice);el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'));let sx=0,sy=0;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{if(locked)return;let t=e.changedTouches[0],rect=drop.getBoundingClientRect();if(Math.abs(t.clientY-sy)>25&&t.clientX>=rect.left&&t.clientX<=rect.right&&t.clientY>=rect.top&&t.clientY<=rect.bottom){e.preventDefault();choose(Number(el.dataset.choice))}},{passive:false})});drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');let n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<3)choose(n)});drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speakQuestion()}});speakQuestion()}
function speakQuestion(){let q=WORLDS[worldIndex].phases[phaseIndex];say('Vamos descobrir! '+q.question+' Escute as opções e toque na figura que escolher. '+q.choices.map((c,i)=>'Figura '+(i+1)+': '+c.label+'.').join(' '))}
function choose(i){if(locked)return;playEffect('click',.18);let w=WORLDS[worldIndex],q=w.phases[phaseIndex],r=document.getElementById('result');if(i===q.answer){playEffect('star',.32);locked=true;let key=worldIndex+'-'+phaseIndex;if(!saved.done[key]){saved.done[key]=true;saved.stars+=10;store()}document.querySelectorAll('.choice')[i].classList.add('selected');r.innerHTML=`<div class="win">🌟🎉</div><div class="feedback">💚 ⭐ +10</div><div style="text-align:center"><button class="primary" onclick="next()" aria-label="Próxima fase">▶️ ➡️</button></div>`;say('Muito bem! '+q.feedback+' Você ganhou dez estrelinhas. Toque na seta para continuar.')}else{playEffect('move',.11);r.innerHTML='<div class="feedback">💛 🔄 <button class="secondary" onclick="repeatVoice()" aria-label="Ouvir novamente">🔊</button></div>';say('Boa tentativa! Vamos pensar de outro jeito. '+q.question+' Tente tocar em outra figura.')}}function next(){playEffect('next',.16);if(phaseIndex<7){phaseIndex++;phase()}else{finished=true;playEffect('fun',.24);app.innerHTML='<section class="panel"><div class="win">🏆🌈🎉</div><div class="feedback">⭐⭐⭐⭐⭐⭐⭐⭐</div><div style="text-align:center"><button class="primary" onclick="home()" aria-label="Voltar para aventuras">🏠 ▶️</button></div></section>';say('Parabéns! Você concluiu as oito fases desta aventura. Escolha uma nova aventura para continuar brincando!')}}function awards(){let count=Object.keys(saved.done).length;app.innerHTML='<section class="panel"><div class="win">🏆</div><div class="feedback">⭐ '+saved.stars+' &nbsp; 🎯 '+count+' / 80</div><div class="grid">'+WORLDS.map((w,i)=>`<button class="world" onclick="start(${i})"><span class="emoji">${w.icon}</span><span class="smallnum">${Object.keys(saved.done).filter(k=>k.startsWith(i+'-')).length}/8</span></button>`).join('')+'</div></section>';say('Seu baú de conquistas tem '+saved.stars+' estrelinhas e '+count+' fases concluídas. Parabéns pelo esforço!')};function toggleEffects(btn){effectsOn=!effectsOn;if(btn)btn.textContent=effectsOn?'🎵 Sons: ligados':'🔇 Sons: desligados';if(effectsOn)playEffect('click',.2)}function adult(){app.innerHTML='<section class="panel"><h2>👨‍👩‍👧 Área do adulto</h2><p>Este jogo tem 10 aventuras e 80 fases, com apresentação gravada da Iskai e narração complementar por voz do navegador. Os botões têm figuras grandes; a criança pode ouvir as perguntas e as opções. As legendas curtas ajudam os responsáveis.</p><p>Os temas espíritas são adaptações educativas originais inspiradas nos valores das obras, não citações literais. Não há conteúdo doutrinário apresentado como prova científica.</p><p>A apresentação da Iskai é um MP3 incluído no aplicativo. As falas das fases ainda dependem da síntese de fala em português do Brasil do aparelho. Para iniciar a narração, toque em uma aventura. Sem voz disponível, um adulto deve acompanhar.</p><p>O progresso fica apenas neste navegador, sem contas, publicidade, coleta de nomes ou envio de dados.</p><button class="secondary" onclick="if(confirm(&quot;Apagar todas as conquistas neste aparelho?&quot;)){saved={done:{},stars:0};store();home()}" aria-label="Apagar progresso">🗑️ Apagar progresso</button><div class="voice-settings"><label for="voiceChoice">🎙️ Voz em português:</label><select id="voiceChoice" onchange="setVoice(this.value)"></select><label for="voiceSpeed">🐢 Velocidade:</label><select id="voiceSpeed" onchange="setSpeed(this.value)"><option value="0.86">Calma</option><option value="0.96">Natural</option><option value="1.05">Animada</option></select><button class="secondary" onclick="say(&quot;Olá, explorador! Vamos brincar e descobrir coisas incríveis!&quot;)">🔊 Testar voz</button></div><p class="parent">A apresentação da Iskai é gravada; as demais falas ainda dependem das vozes instaladas no aparelho. Para narração com voz de estúdio, será preciso acrescentar gravações licenciadas ou áudios próprios.</p><p><button class="primary" onclick="home()">🏠</button></p></section>';populateVoices();say('Área do adulto. Aqui você pode escolher a voz e a velocidade da narração.')};function setVoice(uri){selectedVoiceURI=uri;saved.voiceURI=uri;store();say('Olá, vamos brincar!')}function setSpeed(rate){speechRate=Number(rate);saved.speechRate=speechRate;store();say('Vamos brincar!')}function populateVoices(){let sel=document.getElementById('voiceChoice');if(!sel)return;let voices=ptVoices();sel.innerHTML=voices.length?voices.map(v=>`<option value="${v.voiceURI.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join(''):'<option>Voz padrão do aparelho</option>';sel.value=selectedVoiceURI||preferredVoice()?.voiceURI||'';document.getElementById('voiceSpeed').value=String(speechRate)}selectedVoiceURI=saved.voiceURI||'';speechRate=saved.speechRate||.96;if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=populateVoices;home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
